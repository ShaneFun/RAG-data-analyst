[project]
name = "larkspur-analyst"
version = "0.1.0"
description = "AI Data Analyst agent for the Larkspur Market demo shop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.3,<4",      # talk to Postgres from Python
    "psycopg-pool>=3.3,<4",         # reuse database connections (faster, safer)
    "pgvector>=0.5,<0.6",           # send vectors to pgvector (RAG)
    "fastembed>=0.8,<0.9",          # embedding model that runs locally (RAG)
    "sqlglot>=30.21,<31",           # SQL parser for the safety validator
    "pydantic-settings>=2.15,<3",   # read settings from environment variables / .env
    "pyyaml>=6,<7",                 # read the knowledge-base YAML files
    "numpy>=2,<3",                  # vectors are numpy arrays
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]    # testing + linting (not needed in production)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]                  # our importable package is "app"

[tool.pytest.ini_options]
pythonpath = ["..", "."]            # lets tests import "data" (repo root) and "tests" (backend)
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["app", "data", "tests"]   # tells the linter these are OUR packages