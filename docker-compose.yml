services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: larkspur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d larkspur"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The FastAPI backend in a container: `docker compose up --build api`
  # (run `uv run python -m data.setup_db` once first so the database has data).
  api:
    build: ./backend
    env_file:
      - path: backend/.env      # DEEPSEEK_API_KEY lives here (git-ignored)
        required: false
    environment:
      # inside Docker the database host is the service name "db", not localhost;
      # the API only gets the read-only credential
      DATABASE_URL_RO: postgresql://analyst_ro:analyst_ro@db:5432/larkspur
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
