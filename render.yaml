# Render Blueprint for the API (Render dashboard -> New -> Blueprint -> pick this repo).
# Secrets are marked sync: false, so Render asks for them in the dashboard; they never live in git.
services:
  - type: web
    name: larkspur-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      # Only the read-only credential: the API never needs the admin password.
      - key: DATABASE_URL_RO           # Supabase connection string for analyst_ro
        sync: false
      - key: ALLOWED_ORIGINS           # your Vercel URL, e.g. https://larkspur-analyst.vercel.app
        sync: false
      - key: RATE_LIMIT                # per visitor
        value: 10/hour
      - key: DAILY_QUESTION_LIMIT      # all visitors together (caps LLM spend)
        value: 200/day
